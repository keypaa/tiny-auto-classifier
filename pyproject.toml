[project]
name = "tiny-auto-classifier"
version = "0.1.0"
description = "Tiny CPU Auto-Mode Classifier — Phase 0 Infrastructure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40",
    "tokenizers>=0.19",
    "psutil>=5.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
