# T4 — Qwen3-0.6B decoder ceiling, 32K (YARN+DCA to 128K but train at 32K)
model_id: Qwen/Qwen3-0.6B
mode: decoder
max_length: 8192
train_file: data/train/pilot_10k.jsonl
val_file: data/validation/pilot_10k.jsonl
policy_path: prompts/original/policy.txt
per_device_batch: 1
grad_accum: 16  # slightly larger effective batch for 0.6B stability
epochs: 1
lr: 1.5e-05  # larger model needs slightly lower LR
weight_decay: 0.01
warmup_ratio: 0.06
optimizer: adamw_8bit
precision: fp16
grad_checkpointing: true
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null
output_dir: models/checkpoints/pilot_t4_8k
seed: 42
num_workers: 2
logging_steps: 10
save_steps: 200
